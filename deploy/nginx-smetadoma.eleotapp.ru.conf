# СметаДома — smetadoma.eleotapp.ru
# 1) Скопировать на сервер:
#    sudo cp /opt/fastapi/smetadoma05/deploy/nginx-smetadoma.eleotapp.ru.conf \
#            /etc/nginx/sites-enabled/smetadoma.eleotapp.ru
# 2) Порт API должен совпадать с uvicorn в smetadoma05.service (8008):
#    ss -tlnp | grep 8008
# 3) sudo nginx -t && sudo systemctl reload nginx
# 4) sudo certbot --nginx -d smetadoma.eleotapp.ru
#    (certbot добавит listen 443 и ssl_certificate)

server {
    listen 80;
    listen [::]:80;
    server_name smetadoma.eleotapp.ru;

    root /opt/fastapi/smetadoma05/frontend/dist;
    index index.html;

    client_max_body_size 20M;

    location /api/ {
        proxy_pass http://127.0.0.1:8008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8008;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://127.0.0.1:8008;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://127.0.0.1:8008;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8008;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
