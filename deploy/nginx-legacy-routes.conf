# Старые адреса PHP-сайта больше не обрывают соединение.
# 444 на cabinet.php банил браузер в fail2ban, и puzzlespace.ru переставал отвечать.
location = /cabinet.php { return 301 /cabinet; }
location = /index.php { return 301 /; }
location ~* \.(?:php|asp|aspx|jsp|cgi)$ {
    access_log /var/log/nginx/puzzlespace.ru.access.log main;
    return 404;
}
