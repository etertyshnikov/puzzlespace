<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Дом на Юге</title>
    <style>
      @view-transition { navigation: auto; }
      ::view-transition-old(root) {
        animation: 260ms cubic-bezier(.2, .8, .2, 1) both dom-leave;
      }
      ::view-transition-new(root) {
        animation: 360ms cubic-bezier(.2, .8, .2, 1) both dom-enter;
      }
      @keyframes dom-leave { to { opacity: 0; transform: scale(.985) translateY(-10px); } }
      @keyframes dom-enter { from { opacity: 0; transform: translateY(18px) scale(.99); } }
      @media (prefers-reduced-motion: reduce) {
        ::view-transition-old(root), ::view-transition-new(root) { animation: none; }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script src="https://st.max.ru/js/max-web-app.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
