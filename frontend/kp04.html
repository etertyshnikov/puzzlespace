<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Коммерческое предложение A00001-P01-S01</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 20px;
        }

        /* Контейнер двух колонок */
        .layout {
            display: flex;
            gap: 20px;
        }

        /* Левая колонка — 1/3 */
        .left {
            width: 33%;
        }

        /* Правая колонка — 2/3 */
        .right {
            width: 67%;
        }

        .left img {
            width: 100%;
            margin-bottom: 15px;
            border: 1px solid #ccc;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            font-size: 14px;
        }

        th {
            background: #f5f5f5;
        }

        /* Стили для печати */
        @media print {
            body {
                margin: 0;
            }
            .layout {
                display: flex;
                flex-direction: row;
            }
            .left {
                width: 33%;
            }
            .right {
                width: 67%;
            }
        }
    </style>
</head>

<body>

<h1>Коммерческое предложение № A00001-P01-S01</h1>

<div class="layout">

    <!-- Левая колонка -->
    <div class="left">
        <img src="https://images.pexels.com/photos/1181675/pexels-photo-1181675.jpeg" alt="Изображение решения">
        <img src="https://images.pexels.com/photos/1181675/pexels-photo-1181675.jpeg" alt="Фото 2">
    </div>

    <!-- Правая колонка -->
    <div class="right">
        <h2>Спецификация</h2>

        <table>
            <tr>
                <th>№</th>
                <th>Наименование</th>
                <th>Кол-во</th>
                <th>Цена, €</th>
                <th>Сумма, €</th>
            </tr>
            <tr>
                <td>1</td>
                <td>Позиция 1</td>
                <td>10</td>
                <td>100</td>
                <td>1 000</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Позиция 2</td>
                <td>5</td>
                <td>200</td>
                <td>1 000</td>
            </tr>
            <tr>
                <th colspan="4" style="text-align:right;">Итого:</th>
                <th>2 000</th>
            </tr>
        </table>
    </div>

</div>

</body>
</html>
